<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AK Gold Works Login</title>
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="loginCard" class="card login-card">
        <div class="brand-block">
          <p class="eyebrow">Secure Portal</p>
          <h1>AK Gold Works</h1>
          <p class="subtitle">Access your workspace with your demo credentials.</p>
        </div>

        <form id="loginForm" class="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter username" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" required />

          <button type="submit">Sign In</button>
        </form>

        <p class="hint">Demo users: habib or akhtar<br />Password: akgoldworks</p>
        <p id="errorMessage" class="error" role="alert"></p>
      </section>

      <section id="dashboard" class="card dashboard hidden" aria-live="polite">
        <div class="dashboard-header">
          <div>
            <p class="eyebrow">Welcome back</p>
            <h2><span id="userName">User</span>!</h2>
          </div>
          <button id="logoutButton" type="button" class="secondary-button">Logout</button>
        </div>

        <form id="entryForm" class="entry-form">
          <label for="entryAmount">Amount</label>
          <div class="amount-row">
            <input id="entryAmount" name="entryAmount" type="number" step="0.01" min="0" placeholder="0.00" required />
            <div class="chip-group" role="group" aria-label="Entry type">
              <button type="button" class="chip active" data-type="AYA">AYA</button>
              <button type="button" class="chip" data-type="JAMA">JAMA</button>
            </div>
          </div>

          <label for="entryLabel">Product Label</label>
          <select id="entryLabel" name="entryLabel">
            <option value="">Optional</option>
            <option value="CNC">CNC</option>
            <option value="PARA">PARA</option>
          </select>

          <button type="submit">Submit Entry</button>
        </form>

        <div class="entry-summary">
          <h3>Recorded Entries</h3>
          <div class="table-wrapper">
            <table class="entry-table">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Amount (g)</th>
                  <th>Label</th>
                  <th>Timestamp</th>
                </tr>
              </thead>
              <tbody id="entryList"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="src/firebase/firebase-sdk-config.js"></script>
    <script src="src/js/app.js"></script>
  </body>
</html>
